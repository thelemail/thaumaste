name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: thaumaste
          POSTGRES_PASSWORD: thaumaste
          POSTGRES_DB: thaumaste
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      THAUMASTE_TEST_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1

      # The models are the schema's shape in Go. Regenerating them here catches a migration that
      # landed without a matching `make db-gen`, which would otherwise only surface as a runtime
      # error against a column the models do not know about.
      - name: models match the schema
        run: |
          go tool goose -dir db/migrations/postgres postgres \
            "postgres://thaumaste:thaumaste@127.0.0.1:5435/thaumaste?sslmode=disable" up
          go tool sqlboiler psql -c sqlboiler.toml
          git diff --exit-code -- internal/db/postgres

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0

  complement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: ./scripts/complement.sh allowlist
